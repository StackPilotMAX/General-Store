name: SabziBill Production Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sabzibill-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-cleanup: on-success

      - name: Restore stable direct-distribution signing key
        run: base64 --decode ci/sabzibill-debug.keystore.b64 > ci-debug.keystore

      - name: Verify in-place update version
        run: |
          grep -q 'versionCode = 13' app/build.gradle.kts
          grep -q 'versionName = "2.4.3"' app/build.gradle.kts

      - name: Run ledger, voice, vegetable-search and theme regression tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Run release lint
        run: gradle lintRelease --stacktrace

      - name: Build signed release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify update package and version
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          BADGING="$($AAPT dump badging app/build/outputs/apk/release/app-release.apk | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.stackpilotmax.rameshvegetableshop'"
          echo "$BADGING" | grep -q "versionCode='13'"
          echo "$BADGING" | grep -q "versionName='2.4.3'"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare production APK and checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk SabziBill-v2.4.3-production.apk
          sha256sum SabziBill-v2.4.3-production.apk > SabziBill-v2.4.3-production.apk.sha256

      - name: Upload production artifact
        uses: actions/upload-artifact@v5
        with:
          name: SabziBill-v2.4.3-production
          path: |
            SabziBill-v2.4.3-production.apk
            SabziBill-v2.4.3-production.apk.sha256
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 90
