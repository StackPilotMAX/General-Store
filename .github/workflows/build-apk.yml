name: Shiv Shakti Kirana Store Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: shiv-shakti-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-cleanup: on-success

      - name: Prepare signing key without committing private material
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          rm -f ci-debug.keystore signing-mode.txt

          if [ -n "${ANDROID_SIGNING_KEYSTORE_B64:-}" ]; then
            echo "Using protected repository signing secret."
            printf '%s' "$ANDROID_SIGNING_KEYSTORE_B64" | base64 --decode > ci-debug.keystore
            if ! keytool -list -keystore ci-debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "Protected signing secret exists but is not a valid expected keystore." >&2
              exit 1
            fi
            echo "protected-update-key" > signing-mode.txt
          else
            echo "ANDROID_SIGNING_KEYSTORE_B64 is not configured; generating a CI-only key so tests and APK verification stay green."
            echo "This fallback APK is not an update over an APK signed with a different certificate."
            keytool -genkeypair -v               -keystore ci-debug.keystore               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 36500               -dname "CN=Shiv Shakti Kirana CI,O=Shiv Shakti Kirana Store,C=IN"
            echo "ci-fallback-key" > signing-mode.txt
          fi

      - name: Verify app version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'versionName = "3.0.0"' app/build.gradle.kts

      - name: Run unit tests (retry transient dependency failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle testDebugUnitTest --stacktrace --no-daemon; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            echo "Test attempt $attempt failed; retrying after transient dependency/cache recovery."
            sleep 8
          done

      - name: Run release lint (retry transient dependency failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle lintRelease --stacktrace --no-daemon; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            echo "Lint attempt $attempt failed; retrying."
            sleep 8
          done

      - name: Build signed release APK (retry transient dependency failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle assembleRelease --stacktrace --no-daemon; then
              exit 0
            fi
            [ "$attempt" -eq 3 ] && exit 1
            echo "Build attempt $attempt failed; retrying."
            sleep 8
          done

      - name: Verify APK package and version
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging app/build/outputs/apk/release/app-release.apk | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.stackpilotmax.rameshvegetableshop'"
          echo "$BADGING" | grep -q "versionCode='14'"
          echo "$BADGING" | grep -q "versionName='3.0.0'"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare production APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk ShivShaktiKirana-v3.0.0-production.apk
          sha256sum ShivShaktiKirana-v3.0.0-production.apk > ShivShaktiKirana-v3.0.0-production.apk.sha256
          printf 'signing_mode=' > SIGNING-MODE.txt
          cat signing-mode.txt >> SIGNING-MODE.txt

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShivShaktiKirana-v3.0.0-production
          path: |
            ShivShaktiKirana-v3.0.0-production.apk
            ShivShaktiKirana-v3.0.0-production.apk.sha256
            SIGNING-MODE.txt
            app/build/reports/lint-results-release.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: error
          retention-days: 90
